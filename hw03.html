
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구구단 출력</title>
</head>
<body>
    <h1>구구단</h1>

    <script>
        // 중첩 반복문을 이용한 구구단 출력
        for (let i = 1; i <= 9; i++) {
            document.write("<h3>" + i + "단</h3>");

            for (let j = 1; j <= 9; j++) {
                document.write(
                    i + " x " + j + " = " + (i * j) + "<br>"
                );
            }

            document.write("<br>");
        }
    </script>

</body>
</html>
