<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록</title>
</head>
<body>
    <h1>글머리 기호 목록</h1>
    <u1 type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </u1>
    <h1>순서 번호 목록</h1>
    <ol type="i" start="4">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <h1>정의 목록</h1>
    <d1>
        <dt>프론트엔드</dt>
        <dd>HTML</dd>
        <dd>CSS</dd>
        <dd>JS</dd>
        <dd>백엔드</dd>
        <dd>Node.js</dd>
        <dd>MySQL</dd>
    </d1>
</body>
</html>
